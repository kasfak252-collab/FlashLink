name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare project
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            z=$(find . -name '*.zip' -not -path './.git/*' | head -n1)
            if [ -z "$z" ]; then
              echo "ERROR: repo me project files bhi nahi aur zip bhi nahi"
              ls -la
              exit 1
            fi
            unzip -q -o "$z" -d extracted
            f=$(find extracted -name settings.gradle.kts | head -n1)
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FlashLink-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
